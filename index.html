<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提瓦特 · 攻略工作台</title><meta name="description" content="选择角色、编排队伍与推荐攻略，一键导出你的攻略长图。"><link rel="stylesheet" href="style.css?v=1.1"></head><body>
<header><a class="brand" href="./"><span class="brand-icon">✦</span><span>提瓦特 <b>攻略工作台</b></span></a><div class="header-right"><span id="saveState">草稿自动保存在此设备</span><button id="export" class="primary">↓ 导出攻略长图</button></div></header>
<main><button class="library-backdrop" id="libraryBackdrop" aria-label="关闭角色库"></button><aside aria-label="角色素材库"><div class="library-head"><div><div class="eyebrow">CHARACTER LIBRARY</div><h2>角色素材库 <small id="count">136</small></h2></div><button class="close-library" id="closeLibrary" aria-label="关闭角色库">×</button></div><label class="search"><span>⌕</span><input id="search" placeholder="搜索角色名称…" aria-label="搜索角色名称"><kbd>/</kbd></label><div class="filters" id="elements"></div><div class="library-meta"><span id="resultCount"></span><select id="rarity" aria-label="按星级筛选"><option value="all">全部星级</option><option value="5">★★★★★</option><option value="4">★★★★</option></select></div><div class="batch-tools"><button id="batchToggle">☑ 批量选角色</button><button id="batchApply" class="primary" hidden>加入选中组（0）</button></div><div class="character-grid" id="library"></div><div class="library-foot">点击角色加入选中位置，也可拖入格子</div></aside>
<section class="workspace"><div class="workspace-top"><div><div class="eyebrow">TEYVAT STUDIO · v1.1</div><h1>你的配队，随手成图<span>✦</span></h1><p>写攻略 · 选角色 · 导出手机长图</p></div><span class="draft-badge"><i></i> 正在编辑</span></div><div class="toolbar"><div><button id="add">＋ 添加攻略组</button><button id="undo" title="撤销上一步">↶ 撤销</button></div><div><span id="groupCount"></span><button id="reset" class="quiet">清空画布</button></div></div>
<div class="canvas-wrap"><div class="poster" id="poster"><div class="poster-top"><div class="poster-kicker">攻略笔记 / STRATEGY GUIDE</div><input id="title" maxlength="48" placeholder="输入攻略标题" aria-label="攻略标题"><textarea id="intro" rows="2" placeholder="在这里输入推荐攻略，例如：优先选择冰、风角色，主输出放在第一个位置。" aria-label="推荐攻略说明"></textarea><div class="poster-divider"><span>✦</span></div></div><div class="groups" id="groups"></div><div class="poster-footer"><span>提瓦特 · 配队笔记</span><span>愿每一次冒险，都有好搭档 ✧</span></div></div></div><div class="workspace-tip">✧ 先选中一个空位，再点击左侧角色。点击已放入的角色可替换。</div></section></main><div class="toast" id="toast" role="status"></div><dialog id="exportDialog" aria-labelledby="exportHeading"><div class="export-dialog-head"><div><h2 id="exportHeading">攻略长图已生成</h2><p>点击下载保存；也可以右键或长按下方图片保存。</p></div><button id="closeExport" aria-label="关闭图片预览">×</button></div><div class="export-actions"><a id="downloadImage" class="primary" download>↓ 下载图片</a><a id="openImage" target="_blank" rel="noopener">打开原图 ↗</a></div><div class="export-image-wrap"><img id="exportImage" alt="生成的攻略长图，可右键或长按保存"></div><p class="export-help">如果下载没有响应，请选择“打开原图”后保存，或直接右键 / 长按图片。</p></dialog><nav class="mobile-dock" aria-label="手机操作栏"><button id="openLibrary">＋ 选择角色</button><button id="mobileExport" class="primary">预览 / 导出长图 ↗</button></nav><script src="poster.js?v=1.1"></script><script src="app.js?v=1.1"></script></body></html>
